<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare similar grammar</title>
<script src="./support.js"></script>
<script src="./course-n2.js"></script>
<script src="./course-n5.js"></script>
<script src="./course.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
rt{font-size:9px;font-weight:400;color:#5A6382}
a{color:#2F4FD0;text-decoration:none}a:hover{color:#1B2440}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 50px 16px 34px; background: #F4F5F9; color: #1B2440; font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif; line-break: strict; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; height: 44px; flex-shrink: 0">
<a href="Today.dc.html" onClick="{{ toToday }}" aria-label="Close lesson" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" role="img" aria-label="Teach page 3 of 3">
<div style="height: 10px; border-radius: 5px; background: #2F4FD0"></div>
<div style="height: 10px; border-radius: 5px; background: #2F4FD0"></div>
<div style="height: 10px; border-radius: 5px; background: #2F4FD0"></div>
</div>
<div style="font-size: 12px; font-weight: 800; color: #2F4FD0">学習 LEARN</div>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; margin: 0 -16px; padding: 0 16px 12px; display: flex; flex-direction: column">

<div style="margin-top: 6px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
<div style="font-size: 12px; font-weight: 800; color: #C7361E">似ている文法　COMPARE</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 800; line-height: 1.3">どれを使う？</h1>
<div style="font-size: 13px; font-weight: 500; color: #5A6382; line-height: 1.45">{{ intro }}</div>
</div>

<sc-for list="{{ forms }}" as="f" hint-placeholder-count="3">
<div style="margin-top: 10px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 2px solid #1B2440; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex-grow: 1; font-family: 'Klee One', 'Hiragino Mincho ProN', serif; font-size: 20px; font-weight: 600">{{ f.form }}</div>
<div style="display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; background: {{ f.tagBg }}"><sc-if value="{{ f.down }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C7361E" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></sc-if><sc-if value="{{ f.up }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></sc-if><sc-if value="{{ f.dot }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="#2F4FD0" aria-hidden="true"><circle cx="12" cy="12" r="5"/></svg></sc-if>{{ f.tag }}</div>
</div>
<div lang="ja" style="font-family: 'Klee One', 'Hiragino Mincho ProN', serif; font-size: 15px; font-weight: 600; line-height: 1.9"><sc-for list="{{ f.segs }}" as="g" hint-placeholder-count="3"><sc-if value="{{ g.ruby }}" hint-placeholder-val="{{ false }}"><ruby style="background: {{ g.bg }}; border-radius: 4px">{{ g.t }}<rt>{{ g.r }}</rt></ruby></sc-if><sc-if value="{{ g.plain }}" hint-placeholder-val="{{ true }}"><span style="background: {{ g.bg }}; border-radius: 4px; padding: {{ g.pad }}; white-space: {{ g.ws }}; border-bottom: {{ g.line }}">{{ g.t }}</span></sc-if></sc-for></div>
<div style="font-size: 12px; font-weight: 500; color: #5A6382">{{ f.en }}</div>
</div>
</sc-for>

<div style="margin-top: 14px; padding: 12px 14px 14px; border-radius: 18px; background: #E8ECFB; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
<sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
<div style="font-size: 12px; font-weight: 800; color: #2F4FD0">確認　QUICK CHECK{{ checkLabel }}</div>
</sc-if>
<sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800">
<sc-if value="{{ right }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B7A6B" stroke-width="4" role="img" aria-label="Correct" style="flex-shrink: 0"><circle cx="12" cy="12" r="8.5"/></svg></sc-if>
<sc-if value="{{ wrong }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C7361E" stroke-width="4" stroke-linecap="round" role="img" aria-label="Wrong" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"/></svg></sc-if>
<div>{{ note }}</div>
</div>
</sc-if>
<div lang="ja" style="font-family: 'Klee One', 'Hiragino Mincho ProN', serif; font-size: 15px; font-weight: 600; line-height: 1.9"><sc-for list="{{ q }}" as="g" hint-placeholder-count="3"><sc-if value="{{ g.ruby }}" hint-placeholder-val="{{ false }}"><ruby style="background: {{ g.bg }}; border-radius: 4px">{{ g.t }}<rt>{{ g.r }}</rt></ruby></sc-if><sc-if value="{{ g.plain }}" hint-placeholder-val="{{ true }}"><span style="background: {{ g.bg }}; border-radius: 4px; padding: {{ g.pad }}; white-space: {{ g.ws }}; border-bottom: {{ g.line }}">{{ g.t }}</span></sc-if></sc-for></div>
<div style="display: grid; gap: 8px; grid-template-columns: {{ cols }}">
<sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" aria-pressed="{{ o.on }}" style="height: 46px; padding: 0; border-radius: 14px; font-size: 14px; font-weight: 800; border: {{ o.border }}; background: {{ o.bg }}; box-shadow: {{ o.shadow }}; color: {{ o.color }}">{{ o.label }}</button>
</sc-for>
</div>
</div>

</div>

<a href="Drill.dc.html" onClick="{{ toDrill }}" style="flex-shrink: 0; margin-top: 10px; height: 54px; border-radius: 16px; background: #2F4FD0; border: 2px solid #1B2440; box-shadow: 0 4px 0 #1B2440; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center">練習へ　Start the drill</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"app":{"editor":null},"save":{"editor":null},"miss":{"editor":null},"$preview":{"width":390,"height":844}}'>
const TAGS = { down: '#FDEBE6', up: '#FFF4D6', dot: '#E8ECFB' };
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pick: null };
}
renderVals() {
const C = window.ykCourse;
const s = this.state;
const app = this.props.app || { sid: 'u03d4', day: C.day('u03d4') };
const cmp = (app.day && app.day.grammar && app.day.grammar.compare) || { forms: [], check: { options: [], why: [] } };
const it = cmp.check || { options: [], why: [] };
const nav = (to) => (e) => { const go = this.props.go; if (go) { e.preventDefault(); go(to); } };
const answered = s.pick !== null;
const opts = it.options.map((label, i) => {
let look = { border: '2px solid #1B2440', bg: '#FFFFFF', shadow: '0 3px 0 #1B2440', color: '#1B2440' };
if (answered) {
if (i + 1 === it.answer) look = { border: '2.5px solid #0B7A6B', bg: '#E0F3EF', shadow: 'none', color: '#1B2440' };
else if (i === s.pick) look = { border: '2.5px solid #C7361E', bg: '#FDEBE6', shadow: 'none', color: '#1B2440' };
else look = { border: '2px solid #DDE1EC', bg: '#FFFFFF', shadow: 'none', color: '#5A6382' };
}
return { label, on: s.pick === i, pick: () => this.setState({ pick: i }), ...look };
});
const right = answered && s.pick + 1 === it.answer;
const why = answered ? ((it.why && it.why[s.pick]) || it.explain || '') : '';
return {
intro: cmp.intro,
forms: (cmp.forms || []).map((f) => ({ form: f.form, tag: f.tag, en: f.en, segs: C.rich(f.ja), tagBg: TAGS[f.mark] || '#E8ECFB', down: f.mark === 'down', up: f.mark === 'up', dot: f.mark === 'dot' })),
checkLabel: it.label ? ' · ' + it.label : '',
q: C.rich(it.q),
cols: 'repeat(' + Math.max(1, it.options.length) + ', minmax(0, 1fr))',
opts,
answered,
asking: !answered,
right,
wrong: answered && !right,
note: answered ? (right ? 'せいかい！ ' : 'おしい！ ') + why : '',
toToday: nav('Today'),
toDrill: (e) => {
if (this.props.save) this.props.save({ prog: { g: 1 } });
nav('Drill')(e);
},
};
}
}
</script>
</body>
</html>
