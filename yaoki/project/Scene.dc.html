<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanji in a scene</title>
<script src="./support.js"></script>
<script src="./sound.js"></script>
<script src="./course-n2.js"></script>
<script src="./course-n5.js"></script>
<script src="./course.js"></script>
<script src="./sound-course.js"></script>
<script src="./sound-lessons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#2F4FD0;text-decoration:none}a:hover{color:#1B2440}
rt{font-size:9px;font-weight:400;color:#5A6382}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 50px 16px 34px; background: #F4F5F9; color: #1B2440; font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif; line-break: strict; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; height: 44px; flex-shrink: 0">
<a href="Today.dc.html" onClick="{{ toToday }}" aria-label="Close lesson" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div role="img" aria-label="{{ progressLabel }}" style="flex-grow: 1; display: grid; gap: 4px; grid-template-columns: {{ barCols }}">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="8">
<div style="height: 10px; border-radius: 5px; background: {{ b.bg }}"></div>
</sc-for>
</div>
<div style="font-size: 12px; font-weight: 800; color: #C7361E">学習 LEARN</div>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; margin: 0 -16px; padding: 0 16px 8px; display: flex; flex-direction: column">

<div style="margin-top: 6px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; line-height: 1.3">{{ titleJa }} <span style="font-size: 15px; font-weight: 700; color: #5A6382">{{ titleEn }}</span></h1>
<div style="font-size: 13px; font-weight: 500; color: #5A6382">{{ intro }} {{ count }} of {{ total }} found.</div>
</div>

<div lang="ja" style="margin-top: 12px; padding: 12px; border-radius: 20px; background: #1B2440; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; flex-shrink: 0">
<sc-for list="{{ words }}" as="w" hint-placeholder-count="8">
<button onClick="{{ w.tap }}" aria-pressed="{{ w.on }}" style="position: relative; height: 46px; padding: 0 10px; border-radius: 10px; font-size: 17px; font-weight: 800; white-space: nowrap; background: {{ w.bg }}; color: {{ w.ink }}; border: {{ w.edge }}; outline: {{ w.ring }}; box-shadow: {{ w.glow }}">{{ w.word }}<sc-if value="{{ w.badge }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: -7px; top: -7px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2px solid #C7361E; background: #FFFFFF; color: #C7361E; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center">済</span></sc-if></button>
</sc-for>
</div>

<div style="margin-top: 12px; padding: 12px 14px; border-radius: 18px; background: #FFFFFF; border: 2px solid #1B2440; box-shadow: 0 4px 0 #1B2440; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
<div style="display: flex; align-items: center; gap: 12px">
<div lang="ja" style="font-family: 'Klee One', 'Hiragino Mincho ProN', serif; font-weight: 600; line-height: 1.1; white-space: nowrap; flex-shrink: 0; font-size: {{ d.size }}">{{ d.word }}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<div lang="ja" style="font-size: 16px; font-weight: 800">{{ d.reading }}</div>
<div style="font-size: 13px; font-weight: 500; color: #5A6382">{{ d.gloss }}</div>
</div>
<button aria-label="Play the word" onClick="{{ play }}" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #1B2440; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 150ms; background: {{ playBg }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ d.kanji }}" as="k" hint-placeholder-count="2">
<div style="padding: 8px 10px; border-radius: 12px; background: #F4F5F9; display: flex; align-items: center; gap: 10px">
<div lang="ja" style="font-family: 'Klee One', 'Hiragino Mincho ProN', serif; font-size: 26px; font-weight: 600; white-space: nowrap; flex-shrink: 0">{{ k.c }}</div>
<div style="min-width: 0; display: flex; flex-direction: column"><div lang="ja" style="font-size: 12px; font-weight: 800">{{ k.on }}</div><div style="font-size: 12px; font-weight: 500; color: #5A6382">{{ k.mean }}</div></div>
</div>
</sc-for>
</div>
</div>

<div style="margin-top: 14px; padding: 12px 14px 14px; border-radius: 18px; background: #FFF4D6; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
<sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
<div style="font-size: 12px; font-weight: 800">試験ではこう出る　How the exam asks it · {{ checkType }}</div>
</sc-if>
<sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-start; gap: 6px; font-size: 12px; font-weight: 800; line-height: 1.45">
<sc-if value="{{ right }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B7A6B" stroke-width="4" role="img" aria-label="Correct" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="8.5"/></svg></sc-if>
<sc-if value="{{ wrong }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C7361E" stroke-width="4" stroke-linecap="round" role="img" aria-label="Wrong" style="flex-shrink: 0; margin-top: 2px"><path d="M6 6l12 12M18 6L6 18"/></svg></sc-if>
<div>{{ verdict }}</div>
</div>
<div style="font-size: 12px; font-weight: 500; line-height: 1.45">{{ explain }}</div>
</sc-if>
<div lang="ja" style="font-family: 'Klee One', 'Hiragino Mincho ProN', serif; font-size: 17px; font-weight: 600">{{ checkQ }}</div>
<sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
<div lang="ja" style="display: grid; gap: 6px; grid-template-columns: {{ choiceCols }}">
<sc-for list="{{ choices }}" as="c" hint-placeholder-count="4">
<button onClick="{{ c.pick }}" style="height: 44px; padding: 0; border-radius: 12px; border: 2px solid #1B2440; background: #FFFFFF; font-size: 15px; font-weight: 800">{{ c.label }}</button>
</sc-for>
</div>
</sc-if>
</div>

</div>

<sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
<a href="Today.dc.html" onClick="{{ toDone }}" style="flex-shrink: 0; margin-top: 10px; height: 54px; border-radius: 16px; border: 2px solid #1B2440; box-shadow: 0 4px 0 #1B2440; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; background: {{ tone }}">つぎへ　Next</a>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"app":{"editor":null},"save":{"editor":null},"miss":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const scene = this.scene(props);
const first = scene.words[0] ? scene.words[0].id : null;
/* inside the prototype the first word is open; on its own the artboard shows the designed moment: three words found */
this.state = props && props.go
? { found: first ? [first] : [], sel: first, quiz: null, playing: false }
: { found: scene.words.slice(0, 3).map((w) => w.id), sel: scene.words[2] ? scene.words[2].id : first, quiz: null, playing: false };
}
scene(props) {
const C = window.ykCourse;
const app = (props && props.app) || { day: C.day('u03d4') };
return (app.day && app.day.scene) || { words: [], check: { options: [] } };
}
componentWillUnmount() {
clearTimeout(this.timer);
if (window.ykSound) window.ykSound.stop();
}
renderVals() {
const C = window.ykCourse;
const s = this.state;
const scene = this.scene(this.props);
const nav = (to) => (e) => { const go = this.props.go; if (go) { e.preventDefault(); go(to); } };
const words = scene.words.map((w) => {
const on = s.sel === w.id;
const found = s.found.includes(w.id);
return {
word: w.word,
on,
badge: found && !on,
bg: on ? '#2A3560' : 'transparent',
ink: on ? '#F2B43A' : '#FFFFFF',
edge: found ? '2px solid #6E7BA8' : '2px dashed #6E7BA8',
ring: on ? '3px solid #F2B43A' : 'none',
glow: on ? '0 0 0 5px #1B2440' : 'none',
tap: () => {
clearTimeout(this.timer);
if (window.ykSound) window.ykSound.stop();
this.setState({ sel: w.id, found: found ? this.state.found : this.state.found.concat(w.id), playing: false });
},
};
});
const cur = scene.words.find((w) => w.id === s.sel) || scene.words[0] || { word: '', reading: '', gloss: '', parts: [] };
const len = cur.word.length;
const it = scene.check || { options: [] };
const answered = s.quiz !== null;
const right = answered && s.quiz === it.answer;
const answer = it.options[it.answer - 1] || '';
return {
titleJa: scene.ja,
titleEn: scene.en,
intro: scene.intro || 'Tap every word you would have to read.',
words,
count: s.found.length,
total: scene.words.length,
progressLabel: s.found.length + ' of ' + scene.words.length + ' words found',
barCols: 'repeat(' + Math.max(1, scene.words.length) + ', minmax(0, 1fr))',
bars: scene.words.map((_, i) => ({ bg: i < s.found.length ? '#C7361E' : '#DDE1EC' })),
d: { word: cur.word, reading: cur.reading, gloss: cur.gloss, size: len >= 4 ? '28px' : len === 3 ? '34px' : '40px', kanji: (cur.parts || []).map((p) => ({ c: p[0], on: p[1], mean: p[2] })) },
playBg: s.playing ? '#F2B43A' : '#E8ECFB',
/* each word is a short clip: the button stays lit while it is said. If the sound cannot play, it just lights up for a moment */
play: () => {
clearTimeout(this.timer);
const snd = window.ykSound;
const key = cur.clip;
const sound = !!(key && snd && snd.has(key) && snd.unlock() && snd.play(key));
this.setState({ playing: true });
this.timer = setTimeout(() => this.setState({ playing: false }), sound ? snd.ms(key) + 150 : 1200);
},
checkType: it.type,
checkQ: C.plain(it.q),
asking: !answered,
answered,
right,
wrong: answered && !right,
verdict: right ? 'せいかい！ ' + it.answer + ' ' + answer : 'おしい！ 正解は ' + it.answer + ' ' + answer + '。 Saved to your notebook.',
explain: it.explain || (it.why ? it.why[(s.quiz || 1) - 1] : ''),
tone: right ? '#0B7A6B' : '#C7361E',
/* four short readings sit in one row; longer options take two columns, sentences one */
choiceCols: (() => { const w = Math.max(0, ...it.options.map((o) => C.plain(o).length)); const n = w <= 3 ? it.options.length : w <= 9 ? 2 : 1; return 'repeat(' + Math.max(1, n) + ', minmax(0, 1fr))'; })(),
choices: it.options.map((o, k) => ({
label: (k + 1) + ' ' + o,
pick: () => {
if (this.state.quiz !== null) return;
if (k + 1 !== it.answer && this.props.miss) this.props.miss({ src: it.id, wrong: o });
this.setState({ quiz: k + 1 });
},
})),
toToday: nav('Today'),
toDone: (e) => {
if (this.props.save) this.props.save({ prog: { k: 1 } });
nav('Today')(e);
},
};
}
}
</script>
</body>
</html>
