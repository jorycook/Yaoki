<div aria-hidden="true" style="position: absolute; right: -2px; bottom: -6px">
<dc-import name="Yaoki" mood="{{ mood }}" beat="{{ beat }}" size="{{ 60 }}" eyes="{{ eyes }}" hint-size="60px,60px"></dc-import>
</div>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; animation: yk-rise 400ms 500ms ease-out both">
<div style="font-size: 12px; font-weight: 800; color: #5A6382"><span lang="ja">{{ gameJa }}</span>　{{ gameEn }}</div>
<div lang="ja" style="font-size: 30px; font-weight: 800; line-height: 1.15; color: #C7361E; white-space: nowrap">{{ headline }}</div>
<div style="font-size: 13px; font-weight: 700; line-height: 1.45">{{ subline }}</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; animation: yk-rise 400ms 650ms ease-out both">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
<div style="padding: 10px 6px; border-radius: 14px; background: #F4F5F9; display: flex; flex-direction: column; align-items: center; gap: 1px">
<div style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: {{ s.ink }}">{{ s.value }}</div>
<div style="font-size: 11px; font-weight: 700; color: #5A6382; text-align: center">{{ s.label }}</div>
</div>
</sc-for>
</div>
<div style="font-size: 13px; font-weight: 500; color: #5A6382; line-height: 1.5; animation: yk-rise 400ms 800ms ease-out both">{{ note }}</div>
<div style="flex-grow: 1"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{ again }}" style="height: 54px; border-radius: 16px; background: #FFFFFF; border: 2px solid #1B2440; box-shadow: 0 4px 0 #1B2440; color: #1B2440; font-weight: 800; font-size: 16px"><span lang="ja">もう一度</span>　Again</button>
<button onClick="{{ back }}" style="height: 54px; border-radius: 16px; background: #2F4FD0; border: 2px solid #1B2440; box-shadow: 0 4px 0 #1B2440; color: #FFFFFF; font-weight: 800; font-size: 16px; white-space: nowrap">{{ backLabel }}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mark":{"editor":"enum","options":["hanamaru","maru"],"default":"hanamaru"},"kind":{"editor":null},"level":{"editor":null},"stats":{"editor":null},"slips":{"editor":null},"note":{"editor":null},"again":{"editor":null},"back":{"editor":null},"backLabel":{"editor":null},"$preview":{"width":390,"height":470}}'>
/* The end of a game round: a はなまる for a clean round (drawn as a teacher's red pen draws it), a まる for one finished
   with slips, what the round came to, and Again or Back. A child of each game screen. */
class Component extends DCLogic {
renderVals() {
const p = this.props;
const G = window.ykGame;
const hana = (p.mark || 'hanamaru') === 'hanamaru';
const info = G ? G.info(p.kind || 'match', p.level) : { ja: '漢字マッチ', en: 'Kanji match' };
const slips = p.slips || 0;
return {
hana,
maru: !hana,
markAria: hana ? 'はなまる: a clean round' : 'まる: round done',
gameJa: info.ja,
gameEn: info.en,
headline: hana ? 'はなまる！' : 'まる',
subline: hana ? 'A clean round: not one slip.' : 'Round done, with ' + slips + (slips === 1 ? ' slip' : ' slips') + ' on the way. Yaoki got up every time.',
mood: hana ? 'cheer' : 'happy',
beat: 1,
eyes: 1,
stats: p.stats || [{ value: '6', label: 'pairs', ink: '#1B2440' }, { value: '9', label: 'turns', ink: '#1B2440' }, { value: '0', label: 'slips', ink: '#0B7A6B' }],
note: p.note || 'Games are practice: nothing here counts toward your stamps or goes to your notebook.',
again: p.again || (() => {}),
back: p.back || (() => {}),
backLabel: p.backLabel || 'もどる　Back',
};
}
}
</script>
</body>
</html>
